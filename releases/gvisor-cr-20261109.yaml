notes: |
  What changed since gvisor-cr-20261019

  Rebased onto release-20261109.0, which brings upstream's restore work:
  clocks that stay monotonic across restore, a working VDSO on resume,
  half-closed TCP sockets kept readable, empty mount tables preserved, and
  the shim no longer holding its lock across container creation. The shim
  also now bounds its runtime waits itself.

  Restores driven by the pod annotations still load all pages before the
  restore returns, as before. runsc restore defaults to background loading
  from this base; set dev.gvisor.internal.restore.background=true on the pod
  to get it, and keep the checkpoint image readable until loading finishes.

  After a live CPU grow, checkpoint and restore still size their helper
  threads from the boot-time CPU count. This only affects how fast they run.

  As with gvisor-cr-20261019, install gvisor-bin-linux-<arch>.tar.gz into a
  gvisor-bin/ directory next to this build's runsc, per build, or sandboxes
  fail to start.
