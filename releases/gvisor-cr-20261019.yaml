notes: |
  What changed since gvisor-cr-20260831

  Rebased onto release-20261019.0. The nil ThreadGroup fix for joining a PID
  namespace is now in upstream, so it is no longer carried here.

  Adds live memory resize: an in-place pod resize now shows up in
  /proc/meminfo without a restart. CPU resize now also reaches processes that
  were already running.

  runsc now runs its sentry and helpers from a gvisor-bin/ directory next to
  the runsc binary. Install gvisor-bin-linux-<arch>.tar.gz there, or sandboxes
  fail to start.
